apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: FILE_SERVICE_HOST
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: FILE_SERVICE_HOST
             - name: FILE_SERVICE_PORT
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: FILE_SERVICE_PORT
             - name: IS_SWAGGER_ENABLED
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: IS_SWAGGER_ENABLED
             - name: SEND_INTERNAL_SERVER_ERROR_DETAILS
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: SEND_INTERNAL_SERVER_ERROR_DETAILS
             - name: INCLUDE_TESTING_MODULE
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: INCLUDE_TESTING_MODULE
             - name: COST_FACTOR
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: COST_FACTOR
             - name: DATABASE_URL
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: DATABASE_URL
             - name: EMAIL
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: EMAIL
             - name: EMAIL_PASS
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: EMAIL_PASS
             - name: EMAIL_HOST
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: EMAIL_HOST
             - name: EMAIL_PORT
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: EMAIL_PORT
             - name: NODE_ENV
               valueFrom:
                 secretKeyRef:
                   name: gateway-api-production-config-secret
                   key: NODE_ENV
